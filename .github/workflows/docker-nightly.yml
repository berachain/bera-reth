name: Docker Nightly

on:
  schedule:
    # Run at 1:00 AM UTC every day
    - cron: "0 1 * * *"
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository_owner }}/bera-reth
  DOCKER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bera-reth
  DOCKER_USERNAME: ${{ github.actor }}

jobs:
  docker-nightly:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: "Build and push bera-reth nightly image"
            command: "DOCKER_IMAGE_NAME=${{ env.DOCKER_IMAGE_NAME }} PROFILE=maxperf make docker-build-push-nightly"
          - name: "Build and push bera-reth nightly profiling image"
            command: "DOCKER_IMAGE_NAME=${{ env.DOCKER_IMAGE_NAME }} PROFILE=profiling make docker-build-push-nightly-profiling"

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker builder
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64,amd64
          docker buildx create --use --name cross-builder

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: ${{ matrix.build.name }}
        run: ${{ matrix.build.command }}