name: BeaconKit Integration Test

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

jobs:
  beaconkit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Build bera-reth
      run: cargo build --release

    - name: Clone beacon-kit
      run: |
        cd ..
        git clone https://github.com/berachain/beacon-kit.git

    - name: Run integration test
      run: |
        chmod +x scripts/test-block-progression.sh
        BEACON_KIT_PATH=../beacon-kit TARGET_BLOCK=5 TIMEOUT=300 ./scripts/test-block-progression.sh