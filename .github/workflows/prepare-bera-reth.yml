# Adapted from reth's prepare-reth.yml workflow
# Original: https://github.com/paradigmxyz/reth/blob/main/.github/workflows/prepare-reth.yml
name: Prepare Bera-Reth Image

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
        description: "Docker image tag to use"
      binary_name:
        required: false
        type: string
        default: "bera-reth"
        description: "Binary name to build"
      cargo_features:
        required: false
        type: string
        default: "asm-keccak"
        description: "Cargo features to enable"

jobs:
  prepare-bera-reth:
    timeout-minutes: 45
    runs-on: ubuntu-latest-large
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Full history so vergen-git2's describe works in the hive image build,
          # matching docker-build.yml
          fetch-depth: 0
      - run: mkdir artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and export bera-reth image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: .github/assets/hive/Dockerfile
          tags: ${{ inputs.image_tag }}
          outputs: type=docker,dest=./artifacts/bera-reth_image.tar
          build-args: |
            CARGO_BIN=${{ inputs.binary_name }}
            FEATURES=${{ inputs.cargo_features }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload bera-reth image
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifacts
          path: ./artifacts