name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      tags:
        description: 'Comma-separated Docker tags (e.g. "v1.0.0,latest")'
        required: true
        type: string
      profile:
        description: 'Cargo profile to use'
        required: false
        type: string
        default: 'release'
      features:
        description: 'Cargo features to enable'
        required: false
        type: string
        default: 'jemalloc asm-keccak min-debug-logs'

env:
  DOCKER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bera-reth
  DOCKER_USERNAME: ${{ github.actor }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest-large
            arch: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: linux-arm64
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            BUILD_PROFILE=${{ inputs.profile }}
            FEATURES=${{ inputs.features }}
          provenance: false
          outputs: type=image,name=${{ env.DOCKER_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ inputs.profile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-${{ inputs.profile }}

      - name: Export digest
        run: |
          digest="${{ steps.build.outputs.digest }}"
          mkdir -p ${{ runner.temp }}/digests
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        env:
          IMAGE: ${{ env.DOCKER_IMAGE_NAME }}
          TAGS_INPUT: ${{ inputs.tags }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          # Intentionally unquoted for word-splitting (tags are controlled by callers)
          TAGS=""
          for tag in ${TAGS_INPUT//,/ }; do
            TAGS="$TAGS --tag ${IMAGE}:${tag}"
          done

          # Collect per-platform digests into image references
          SOURCES=""
          for digest in $(ls "$DIGEST_DIR"); do
            SOURCES="$SOURCES ${IMAGE}@sha256:${digest}"
          done

          docker buildx imagetools create $TAGS $SOURCES
