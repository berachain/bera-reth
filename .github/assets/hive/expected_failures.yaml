  # Untriaged baseline captured from the first EELS run that actually executed on Berachain
  # (https://github.com/berachain/bera-reth/actions/runs/33685694817). The EELS simulators had
  # failed to start on every scheduled main run since at least 2026-08-22, so these have no
  # reth v1.11.4 comparison point and are recorded here to keep future regressions visible.
  #
  # Known-by-design divergence: bera-reth only emits EIP-6110 deposit requests from Osaka
  # onward (the consensus layer ingests deposits from logs before that), so every
  # `eip6110_deposits` / `eip7685 multi_type_requests` case that expects a Prague deposit
  # request in the requests hash fails. The remaining families (Osaka deposit variants,
  # `eip3860` over-limit initcode at fork_Osaka, `eip6780` reentrancy selfdestruct in
  # consume-rlp) still need triage.
  #
  # The two frontier `test_program_program_SUICIDE-debug` scenarios (fork_Paris/fork_Shanghai)
  # failed on the reth v2.5.0 image but passed on v2.5.2 (34266112103) and were dropped from
  # this list; if they flip back, move them to ignored_tests.yaml as flaky.
  - tests/prague/eip6110_deposits/test_deposits.py::test_deposit[fork_Osaka-blockchain_test_engine-many_deposits_from_contract]-bera-reth
  - tests/prague/eip6110_deposits/test_deposits.py::test_deposit[fork_Osaka-blockchain_test_engine-multiple_deposit_from_different_eoa]-bera-reth
  - tests/prague/eip6110_deposits/test_deposits.py::test_deposit[fork_Osaka-blockchain_test_engine-multiple_deposit_from_same_eoa]-bera-reth
