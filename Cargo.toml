[package]
name = "bera-reth"
version = "1.4.3"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
alloy-consensus = "2.1.1"
alloy-eips = "2.1.1"
alloy-evm = "0.37.1"
alloy-genesis = "2.1.1"
alloy-network = "2.1.1"
alloy-primitives = "1.6.0"
alloy-rlp = "0.3.16"
alloy-rpc-types = "2.1.1"
alloy-rpc-types-eth = "2.1.1"
alloy-serde = "2.1.1"
alloy-signer-local = "2.1.1"
alloy-sol-macro = "1.6.0"
alloy-sol-types = "1.6.0"
bytes = "1.10.1"
clap = { version = "4.5.40", features = ["derive"] }
derive_more = "2.0.1"
eyre = "0.6.12"
sha2 = "0.10"

# rpc
jsonrpsee = "0.26.0"
jsonrpsee-core = { version = "0.26.0", features = ["server"] }
jsonrpsee-proc-macros = "0.26.0"

async-trait = "0.1.88"
metrics = "0.24.3"
modular-bitfield = "0.13.1"
# reth v2.4.0 default features add `jit` (revmc, requires system LLVM) and `gmp`;
# opt out and keep the v1.11.4-equivalent feature set.
reth = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0", default-features = false, features = ["otlp", "otlp-logs", "js-tracer", "keccak-cache-global", "asm-keccak", "min-debug-logs"] }
reth-basic-payload-builder = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-cli = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-cli-commands = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-cli-util = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-codecs = "0.5.2"
reth-consensus-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-db = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-db-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-engine-local = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-engine-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-errors = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-ethereum-cli = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-ethereum-engine-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-ethereum-payload-builder = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-evm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-network-peers = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-node-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-node-builder = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-node-core = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-payload-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-payload-validator = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-primitives-traits = "0.5.2"
reth-revm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0", default-features = false, features = ["portable"] }
reth-rpc = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-rpc-convert = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-rpc-engine-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-rpc-eth-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-rpc-eth-types = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-storage-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = "1.0"
thiserror = "2.0"
tokio = "1.46.0"
tracing = "0.1.41"

[dev-dependencies]
alloy-provider = "2.1.1"
alloy-rpc-client = "2.1.1"
alloy-rpc-types-trace = "2.1.1"
eyre = "0.6.12"
reth-e2e-test-utils = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-rpc-builder = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
revm-inspectors = "0.41.0"
tempfile = "3"
test-fuzz = "7"

[build-dependencies]
vergen = { version = "10.0.1", features = ["build", "cargo", "emit_and_set"] }
vergen-git2 = "10.0.1"

[features]
default = ["jemalloc"]
jemalloc = ["reth/jemalloc"]
asm-keccak = ["reth/asm-keccak"]
min-debug-logs = ["reth/min-debug-logs"]
client = []

# Match upstream reth: keep dev/test artifacts small enough to link on
# disk-constrained runners (https://github.com/paradigmxyz/reth Cargo.toml).
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"

[profile.hivetests]
inherits = "test"
opt-level = 3
lto = "thin"

[package.metadata.cargo-machete]
ignored = ["modular-bitfield", "reth-revm"]

